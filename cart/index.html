<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина | AirComfort Shop</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl font-bold mb-8">Корзина покупок</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Список товаров -->
      <div class="lg:col-span-2">
        <div id="cart-items" class="space-y-4">
          <!-- Товары загружаются через JS -->
        </div>
        
        <!-- Промокод -->
        <div class="mt-8 bg-white p-6 rounded-xl shadow">
          <h3 class="font-bold mb-4">Введите промокод</h3>
          <div class="flex gap-2">
            <input type="text" placeholder="Промокод" class="flex-1 px-4 py-2 border rounded-lg">
            <button class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-gray-900">Применить</button>
          </div>
        </div>
      </div>
      
      <!-- Итоги заказа -->
      <div class="lg:col-span-1">
        <div class="bg-white p-6 rounded-xl shadow sticky top-8">
          <h3 class="text-xl font-bold mb-6">Итоги заказа</h3>
          
          <div class="space-y-3 mb-6">
            <div class="flex justify-between">
              <span>Товары (3)</span>
              <span id="subtotal">0 BYN</span>
            </div>
            <div class="flex justify-between">
              <span>Доставка</span>
              <span id="delivery">0 BYN</span>
            </div>
            <div class="flex justify-between">
              <span>Скидка</span>
              <span class="text-green-600" id="discount">-0 BYN</span>
            </div>
            <div class="border-t pt-3">
              <div class="flex justify-between text-xl font-bold">
                <span>Итого</span>
                <span id="total">0 BYN</span>
              </div>
            </div>
          </div>
          
          <a href="checkout.html" class="block w-full bg-primary text-white text-center py-3 rounded-lg font-bold hover:bg-green-600 mb-4">
            Перейти к оформлению
          </a>
          
          <p class="text-sm text-gray-600 text-center">
            Нажимая кнопку, вы соглашаетесь с условиями обработки персональных данных
          </p>
        </div>
        
        <!-- Безопасность -->
        <div class="mt-6 bg-white p-6 rounded-xl shadow">
          <h4 class="font-bold mb-4">Безопасная покупка</h4>
          <div class="space-y-2 text-sm">
            <div class="flex items-center">
              <i class="ri-shield-check-line text-green-600 mr-2"></i>
              <span>Безопасная оплата</span>
            </div>
            <div class="flex items-center">
              <i class="ri-lock-line text-green-600 mr-2"></i>
              <span>Данные защищены</span>
            </div>
            <div class="flex items-center">
              <i class="ri-exchange-line text-green-600 mr-2"></i>
              <span>Возврат в течение 14 дней</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="/js/cart.js"></script>
</body>
</html>
