<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина | AirComfort</title>
  <meta name="description" content="Ваша корзина товаров AirComfort">
  
  <!-- Повторяем все мета-теги, Tailwind и стили как в catalog.html -->
  <!-- ... (копируем head из catalog.html) ... -->
</head>
<body class="font-sans bg-gradient-to-br from-gray-50 to-white">
  <!-- Навигация (как в catalog.html) -->
  <nav class="bg-white shadow-lg py-4 px-4 sm:px-6 fixed w-full z-50 border-b">
    <!-- ... (копируем навигацию из catalog.html) ... -->
  </nav>

  <!-- Хлебные крошки -->
  <div class="pt-20 pb-6 max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center text-sm text-gray-600">
      <a href="index.html" class="hover:text-primary">Главная</a>
      <i class="ri-arrow-right-s-line mx-2"></i>
      <a href="catalog.html" class="hover:text-primary">Каталог</a>
      <i class="ri-arrow-right-s-line mx-2"></i>
      <span class="text-gray-900 font-medium">Корзина</span>
    </div>
  </div>

  <!-- Основной контент корзины -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Корзина</h1>
    
    <div id="cart-content">
      <!-- Контент корзины будет загружен через JavaScript -->
    </div>
  </div>

  <!-- Футер -->
  <footer class="bg-gradient-to-r from-gray-900 to-gray-800 text-white py-12 mt-12">
    <!-- ... (копируем футер из catalog.html) ... -->
  </footer>

  <script>
    // Загрузка корзины
    document.addEventListener('DOMContentLoaded', function() {
      loadCart();
      updateCartCount();
    });
    
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartContent = document.getElementById('cart-content');
      
      if (cart.length === 0) {
        cartContent.innerHTML = `
          <div class="text-center py-12">
            <i class="ri-shopping-cart-line text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-medium text-gray-900 mb-2">Корзина пуста</h3>
            <p class="text-gray-600 mb-6">Добавьте товары из каталога</p>
            <a href="catalog.html" class="gradient-bg text-white px-6 py-3 rounded-button font-medium hover:shadow-glow transition-all inline-block btn-animate">
              <i class="ri-store-line mr-2"></i> Перейти в каталог
            </a>
          </div>
        `;
        return;
      }
      
      let totalPrice = 0;
      let totalInstallation = 0;
      
      cartContent.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2">
            <div class="bg-white rounded-lg shadow-card overflow-hidden">
              <div class="p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-6">Товары в корзине</h2>
                <div id="cart-items" class="space-y-6">
                  <!-- Товары будут добавлены через JavaScript -->
                </div>
              </div>
            </div>
          </div>
          <div>
            <div class="bg-white rounded-lg shadow-card overflow-hidden sticky top-24">
              <div class="p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-6">Оформление заказа</h2>
                <div class="space-y-4 mb-6">
                  <div class="flex justify-between">
                    <span class="text-gray-600">Товары:</span>
                    <span id="subtotal" class="font-medium">0 BYN</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-600">Установка:</span>
                    <span id="installation-total" class="font-medium">0 BYN</span>
                  </div>
                  <div class="border-t pt-4">
                    <div class="flex justify-between text-lg font-bold">
                      <span>Итого:</span>
                      <span id="total" class="text-primary text-xl">0 BYN</span>
                    </div>
                  </div>
                </div>
                <a href="checkout.html" class="block w-full gradient-bg text-white px-6 py-3 rounded-button font-medium hover:shadow-glow transition-all text-center btn-animate mb-4">
                  <i class="ri-check-line mr-2"></i> Оформить заказ
                </a>
                <a href="catalog.html" class="block w-full bg-gray-100 text-gray-700 px-6 py-3 rounded-button font-medium hover:bg-gray-200 transition-colors text-center btn-animate">
                  <i class="ri-arrow-left-line mr-2"></i> Продолжить покупки
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
      
      const cartItems = document.getElementById('cart-items');
      
      cart.forEach(item => {
        totalPrice += item.price * item.quantity;
        totalInstallation += item.installationPrice * item.quantity;
        
        const itemElement = document.createElement('div');
        itemElement.className = 'flex items-center border-b pb-6';
        itemElement.innerHTML = `
          <div class="flex-shrink-0 w-24 h-24">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover rounded-lg">
          </div>
          <div class="ml-6 flex-1">
            <h3 class="font-medium text-gray-900 mb-1">${item.name}</h3>
            <div class="flex items-center justify-between">
              <div>
                <span class="text-primary font-bold">${item.price} BYN</span>
                <span class="text-gray-500 text-sm ml-2">× ${item.quantity}</span>
              </div>
              <div class="text-gray-600">
                <span class="text-sm">Установка: </span>
                <span class="font-medium">${item.installationPrice} BYN</span>
              </div>
            </div>
          </div>
          <div class="ml-4">
            <div class="flex items-center space-x-2">
              <button onclick="updateQuantity(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 btn-animate">
                <i class="ri-subtract-line"></i>
              </button>
              <span class="w-10 text-center font-medium">${item.quantity}</span>
              <button onclick="updateQuantity(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 btn-animate">
                <i class="ri-add-line"></i>
              </button>
              <button onclick="removeFromCart(${item.id})" class="w-8 h-8 flex items-center justify-center bg-red-100 text-red-600 rounded-full hover:bg-red-200 ml-4 btn-animate">
                <i class="ri-delete-bin-line"></i>
              </button>
            </div>
            <div class="text-right mt-2">
              <span class="text-gray-900 font-bold">${(item.price + item.installationPrice) * item.quantity} BYN</span>
            </div>
          </div>
        `;
        cartItems.appendChild(itemElement);
      });
      
      document.getElementById('subtotal').textContent = totalPrice + ' BYN';
      document.getElementById('installation-total').textContent = totalInstallation + ' BYN';
      document.getElementById('total').textContent = (totalPrice + totalInstallation) + ' BYN';
    }
    
    function updateQuantity(productId, change) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const itemIndex = cart.findIndex(item => item.id === productId);
      
      if (itemIndex !== -1) {
        cart[itemIndex].quantity += change;
        
        if (cart[itemIndex].quantity <= 0) {
          cart.splice(itemIndex, 1);
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        updateCartCount();
      }
    }
    
    function removeFromCart(productId) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart = cart.filter(item => item.id !== productId);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
      updateCartCount();
    }
    
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const cartCount = document.getElementById('cart-count');
      if (cartCount) {
        cartCount.textContent = totalItems;
      }
    }
  </script>
</body>
</html>
